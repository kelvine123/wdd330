<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Home</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>

<body>

<header class="divider">
  <div class="logo">
    <img src="/images/noun_Tent_2517.svg" alt="tent image for logo" />
    <a href="index.html">Sleep<span class="highlight">Outside</span></a>
  </div>
  <nav class="site-nav" aria-label="Main navigation">
    <a href="/index.html" aria-current="page">Shop</a>
    <a class="cart" href="/cart/index.html" aria-label="View cart">Cart</a>
  </div>
</header>

<main class="divider">

<div class="hero">
  <img
    src="/images/banner-sm.jpg"
    srcset="/images/banner-sm.jpg 500w, /images/banner.jpg"
    alt="image of a high mountain lake"
  />

  <div class="mission">
    <p>Outdoor essentials for your next Kenyan adventure.</p>
    <a href="#catalog" class="hero-action">Explore the collection</a>
  </div>
</div>

<section class="products" id="catalog" aria-labelledby="catalog-title">
  <div class="catalog-heading">
    <div>
      <p class="eyebrow">Built for the outdoors</p>
      <h1 id="catalog-title">Find your next adventure</h1>
      <p>Shop tents, backpacks, and sleeping bags. Prices are shown in Kenyan shillings.</p>
    </div>
    <p id="result-count" class="result-count" aria-live="polite"></p>
  </div>

  <div class="catalog-controls">
    <label for="category-filter">Category
      <select id="category-filter">
        <option value="all">All products</option>
      </select>
    </label>
    <label for="product-search">Search
      <input id="product-search" type="search" placeholder="Search gear or brand" />
    </label>
  </div>

  <p id="catalog-status" class="catalog-status" role="status" hidden></p>
  <ul class="product-list" aria-live="polite"></ul>
</section>

</main>

<footer>
&copy;2026 Kelvine | SleepOutside | Kenya
</footer>

<script type="module" src="/js/main.js"></script>

</body>
</html>
