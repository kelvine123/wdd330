<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="../js/checkout.js" type="module"></script>
</head>

<body>

    <!-- Header -->
    <header class="divider">
        <div class="logo">
            <img src="/images/noun_Tent_2517.svg" alt="tent image for logo">
            <a href="/index.html">Sleep <span class="highlight">Outside</span></a>
        </div>

        <div class="cart">
            <a href="/cart/index.html">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
          <path d="M18.9 32.6c1.1 2.4 2.5 3.3 5.4 3.3 1.6 0 3.6-0.3 5.9-0.6 3.2-0.5 6.9-1 11.2-1 2.1 0 4.3 0.1 6.4 0.3 2.1 0.1 4.2 0.3 6.1 0.3 3.2 0 5.2-0.4 5.9-1.2 2.7-2.7 2.8-8.8 2.9-14.6 0.1-6.7 0.2-14.5 4.6-18.7 -0.5 0-1 0-1.6 0 -14.2 0-37.5 0-41.1 0C15.6 6.2 14.9 23.6 18.9 32.6z"></path>
        </svg>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="divider checkout-container">

        <!-- Checkout Form -->
        <section class="checkout-form">
            <h2>Review & Place Your Order</h2>

            <form id="checkout-form">

                <!-- Customer Info -->
                <h3>Customer Information</h3>
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" required>

                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" required>

                <label for="street">Street Address</label>
                <input type="text" id="street" name="street" required>

                <label for="city">City</label>
                <input type="text" id="city" name="city" required>

                <label for="state">State</label>
                <input type="text" id="state" name="state" required>

                <label for="zip">Zip Code</label>
                <input type="text" id="zip" name="zip" required>

                <!-- Payment Info -->
                <h3>Payment Information</h3>
                <label for="cardNumber">Credit Card Number</label>
                <input type="text" id="cardNumber" name="cardNumber" required>

                <label for="expiration">Expiration Date</label>
                <input type="text" id="expiration" name="expiration" placeholder="MM/YY" required>

                <label for="code">Security Code</label>
                <input type="text" id="code" name="code" required>

                <!-- Submit -->
                <button type="submit" class="checkout-btn">Place Order</button>

            </form>
        </section>

        <!-- Order Summary -->
        <aside class="order-summary">
            <h3>Order Summary</h3>
            <p>Subtotal: $<span id="subtotal">0.00</span></p>
            <p>Tax (6%): $<span id="tax">0.00</span></p>
            <p>Shipping: $<span id="shipping">0.00</span></p>
            <h3>Total: $<span id="orderTotal">0.00</span></h3>
        </aside>

    </main>

    <!-- Footer -->
    <footer>
        &copy; NOT a real business
    </footer>

</body>

</html>
