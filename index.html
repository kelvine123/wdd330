<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubuntu Airline Booking</title>

    <link rel="stylesheet" href="/src/css/style.css">
</head>

<body>

    <header>
        <h1>Ubuntu Airline ✈️</h1>
        <p>Book Flights Easily</p>
    </header>

    <main>
        <form id="searchForm">
            <input type="text" id="from" placeholder="From (e.g. NBO)" required>
            <input type="text" id="to" placeholder="To (e.g. MBA)" required>

            <button id="searchBtn">
            <span id="btnText">Search Flights</span>
        </button>
        </form>

        <div id="results"></div>
    </main>

    <script type="module" src="/src/js/main.js"></script>

</body>

</html>
